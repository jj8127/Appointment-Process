project_id = "fc-onboarding-app"

# Public signup/directory actions and purpose-isolated custom member sessions.
# Every protected action validates its actor inside the handler.
[functions.platform-service]
verify_jwt = false

# Scheduled GaramLink import; the handler accepts only the exact service-role key.
[functions.messenger-garamlink-sync]
verify_jwt = false

# Authentication is the signed custom app session, checked inside this function.
[functions.get-my-referral-allowance]
verify_jwt = false

# GaramLink server calls with the existing project anon JWT. The handler also
# verifies the signed bridge and its current canonical account generation.
[functions.verify-request-board-session]
verify_jwt = true

# Admin web uses its existing service-role transport. The handler verifies both
# that transport and the app token signature plus canonical account generation.
[functions.verify-app-session]
verify_jwt = true

# Public invite landing page opened from shared links; it serves HTML only.
[functions.invite]
verify_jwt = false

# Authentication is the signed custom app session, checked inside this function.
[functions.device-token-register]
verify_jwt = false
