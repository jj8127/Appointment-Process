name: CI

on:
  pull_request:
  push:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ''
      SENTRY_DISABLE_UPLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: App TypeScript
        run: npm run typecheck

      - name: Test discovery inventory
        run: npm run test:discovery

      - name: Test
        run: npm test -- --runInBand

      - name: Node tooling and Edge unit tests
        run: |
          npm run test:tools
          npm run test:edge:node

  web:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ''
      SENTRY_DISABLE_UPLOAD: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      STAFF_SESSION_SECRET: ci-staff-session-secret-at-least-16
      FC_GRAPH_SESSION_SECRET: ci-fc-graph-session-secret-at-least-16
      AUTH_SECRET: ci-auth-secret-at-least-16
      REQUEST_BOARD_BRIDGE_TOKEN_SECRET: ci-request-board-bridge-secret
      FC_APP_SESSION_TOKEN_SECRET: ci-fc-app-session-secret
      REQUEST_BOARD_AUTH_BRIDGE_SECRET: ci-legacy-bridge-secret
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root runtime test dependencies
        run: npm ci --ignore-scripts
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Web Node tests
        run: npm test

      - name: Build
        run: npm run build

  edge-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.3
      - name: Cache locked Deno test dependencies
        run: node scripts/ci/run-discovered-tests.mjs edge-deno --cache-deno
      - name: Deno tests without runtime network access
        run: npm run test:edge:deno

  sql-fixtures:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: otp_fixture
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otp_fixture -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/ci/fixtures/package-lock.json
      - name: Install pinned disposable database test dependencies
        run: npm ci --ignore-scripts --prefix scripts/ci/fixtures
      - name: PGlite SQL fixtures
        run: npm run test:sql:pglite
      - name: PostgreSQL concurrency fixtures
        run: npm run test:sql:postgres
